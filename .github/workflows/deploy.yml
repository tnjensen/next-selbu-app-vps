name: Deploy Selbu App

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Tar project for VPS
        run: |
          tar -czf deploy.tgz \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .env \
            --exclude deploy.tgz \
            . || true

      - name: Upload to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tgz"
          target: "${{ secrets.DEPLOY_PATH }}/"

      - name: Deploy on VPS (migrate + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # pakk ut
            tar -xzf deploy.tgz
            rm -f deploy.tgz

            # env må ligge på VPS. Anbefalt fil:
            # - $VPS_PATH/.env
            # der DATABASE_URL og auth secrets ligger.
            # (Ikke send secrets i repo.)

            # installer + build (valgfritt siden CI build allerede kjørte,
            # men på VPS er dette ofte enklest og mest deterministisk)
            npm ci
            npm run build

            # migrasjoner
            npx prisma migrate deploy

            # pm2 restart (start hvis ikke finnes). Appen kjøres på port 3002 for å matche nginx.
            PORT=3002 pm2 start npm --name selbu -- start --update-env || pm2 restart selbu
            pm2 save
